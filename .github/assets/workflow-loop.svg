<!--
  Generated diagram: the README's twelve-stage loop.
  Solid line is the happy path; dashed line is a gate sending work backwards.
  Regenerate both variants together so light and dark cannot drift.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750" viewBox="0 0 500 750" role="img" aria-label="The Gatecraft loop: Understand, Research, Plan, Design, Implement, Review, Critique, Improve, Validate, Test, Document, Evaluate, Done. Review sends work back to Implement when a defect is found, Test sends it back to Implement when a test fails, Validate sends it back to Improve when there is no evidence, and Evaluate sends it back to Plan when the readiness score is below 90.">

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify everything but do not publish'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify payload
        run: npm run verify:payload

      # A tag that disagrees with package.json publishes the wrong version under
      # the right name, which is close to unrecoverable on npm.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "releasing v$pkg"

  publish:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    environment: release
    permissions:
      contents: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # npm rejects a republish of an existing version outright, which failed the
      # whole job and skipped the GitHub release below it. Publishing by hand and
      # then pushing the tag is a normal thing to do for a first release, so treat
      # "already on the registry" as success and carry on to the release notes.
      # `verify` above already refuses a tag that disagrees with package.json, so
      # this cannot silently skip a version that was meant to be published.
      - name: Publish
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "gatecraft@$version" version >/dev/null 2>&1; then
            echo "::notice::gatecraft@$version is already on npm — skipping publish"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract the release notes for this version
        shell: bash
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' payload/CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "No changelog entry found for v$version." > /tmp/notes.md
          fi
          cat /tmp/notes.md

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/notes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to a PR should cancel the first run rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test / node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The CLI writes files, reads .gitignore, and shells out to git. All three
        # behave differently on Windows, so it is tested, not assumed.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No `npm ci` — there are no dependencies, and there never will be.
      - name: Assert zero runtime dependencies
        shell: bash
        run: |
          deps=$(node -p "Object.keys(require('./package.json').dependencies||{}).length")
          if [ "$deps" != "0" ]; then
            echo "::error::gatecraft must have zero runtime dependencies, found $deps"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # A Windows checkout converts text files to CRLF, which is how the heading
  # parsers came to match nothing while every job on Linux stayed green. Running
  # that conversion explicitly on Linux makes the whole class reproducible in
  # seconds, locally and here, instead of only on a Windows runner.
  crlf:
    name: CRLF checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Convert the working tree to CRLF
        run: |
          set -eu
          find . -path ./.git -prune -o -type f \
            \( -name '*.md' -o -name '*.json' -o -name '*.yml' \) -print |
            while IFS= read -r f; do
              sed -i 's/$/\r/' "$f"
            done
          file payload/SYSTEM.md

      - name: Test
        run: npm test

      - name: Verify the payload still parses
        run: |
          node -e "const links = require('./src/lib/links.js'); const r = links.check('payload'); if (r.broken.length) { console.error('::error::' + r.broken.length + ' broken links under CRLF'); process.exit(1); } console.log('links resolve under CRLF: ' + r.checked + ' checked');"

  payload:
    name: verify payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Links, placeholders, banned markers, and version agreement across
      # package.json / VERSION.md / CHANGELOG.md.
      - name: Verify framework documents
        run: npm run verify:payload

  install-sh:
    name: install.sh / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Shell syntax
        run: sh -n install.sh

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh install.sh

      # Serve a locally packed tarball as a stand-in registry, so the installer is
      # exercised end to end without depending on a published release.
      - name: Install from a local registry stub
        shell: bash
        run: |
          set -eu
          mkdir -p /tmp/reg/gatecraft/-
          npm pack --pack-destination /tmp/reg/gatecraft/- --silent
          version=$(node -p "require('./package.json').version")
          # npm already creates gatecraft-${version}.tgz at the destination, no mv needed
          test -f "/tmp/reg/gatecraft/-/gatecraft-${version}.tgz" || mv /tmp/reg/gatecraft/-/*.tgz "/tmp/reg/gatecraft/-/gatecraft-${version}.tgz"
          printf '{"version":"%s"}' "$version" > /tmp/reg/gatecraft/latest

          # Serve with node rather than python3: setup-node above guarantees node
          # exists on every runner, python3 is an assumption about the image.
          cat > /tmp/serve.js <<'SERVER'
          const http = require('http'), fs = require('fs'), path = require('path');
          http.createServer((req, res) => {
            const p = path.join('/tmp/reg', decodeURIComponent(req.url.split('?')[0]));
            fs.readFile(p, (err, buf) => {
              if (err) { res.writeHead(404); return res.end('not found'); }
              res.writeHead(200); res.end(buf);
            });
          }).listen(8731, '127.0.0.1', () => console.log('ready'));
          SERVER
          node /tmp/serve.js & echo $! > /tmp/serve.pid

          # Wait for readiness instead of sleeping a fixed interval, which races
          # on a loaded runner.
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8731/gatecraft/latest >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8731/gatecraft/latest \
            || { echo "::error::registry stub never came up"; exit 1; }

          mkdir -p /tmp/target && cd /tmp/target
          git init -q
          printf '[project]\nname = "demo"\ndependencies = ["fastapi"]\n' > pyproject.toml

          GATECRAFT_REGISTRY=http://127.0.0.1:8731 sh "$GITHUB_WORKSPACE/install.sh" --quiet

          test -f .ai/SYSTEM.md          || { echo "::error::framework not installed"; exit 1; }
          test -f AGENTS.md              || { echo "::error::bootstrap not written"; exit 1; }
          grep -q '^\.ai/$' .gitignore   || { echo "::error::.ai/ was not git-ignored"; exit 1; }

          # The invisibility guarantee, asserted rather than trusted.
          git add -A
          if git status --short | grep -q '\.ai/'; then
            echo "::error::.ai/ is visible to git"; exit 1
          fi

          # A Node CLI must adopt an install.sh manifest instead of reporting the
          # whole framework as user-created.
          node "$GITHUB_WORKSPACE/bin/gatecraft.js" status | tee /tmp/status.txt
          grep -q 'pristine' /tmp/status.txt || { echo "::error::manifest was not adopted"; exit 1; }

  pack:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A tarball missing payload/ installs cleanly and fails on first use — the
      # worst packaging bug available to this project.
      - name: Assert the tarball carries the framework
        shell: bash
        run: |
          set -eu
          npm pack --silent
          tar -tzf ./*.tgz > /tmp/contents.txt

          for required in \
            package/bin/gatecraft.js \
            package/src/cli.js \
            package/payload/SYSTEM.md \
            package/payload/PROJECT_CONTEXT.md \
            package/install.sh \
            package/LICENSE \
            package/TRADEMARK.md \
            package/payload/LICENSE
          do
            grep -qx "$required" /tmp/contents.txt || {
              echo "::error::$required is missing from the published tarball"; exit 1; }
          done

          docs=$(grep -c '^package/payload/.*\.md$' /tmp/contents.txt)
          if [ "$docs" -lt 30 ]; then
            echo "::error::only $docs framework documents in the tarball, expected 35"; exit 1
          fi
          echo "tarball carries $docs framework documents"

          # spec/ is provenance, not product — it must not ship.
          if grep -q '^package/spec/' /tmp/contents.txt; then
            echo "::error::spec/ leaked into the published package"; exit 1
          fi

      - name: Install the tarball and run it as a user would
        shell: bash
        run: |
          set -eu
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/*.tgz --silent
          npx gatecraft init --yes
          test -f .ai/SYSTEM.md || { echo "::error::init failed from the packed tarball"; exit 1; }
          # MIT obliges anyone redistributing the framework to carry the copyright
          # and permission notice with it. Installing it into .ai/ is what makes
          # that automatic for a team that commits the folder.
          test -f .ai/LICENSE || { echo "::error::the licence did not install into .ai/"; exit 1; }
          npx gatecraft doctor
